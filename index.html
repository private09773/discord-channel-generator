<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Text Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Discord Text Generator</h1>
        
        <div class="input-section">
            <label for="input">Enter Text</label>
            <input type="text" id="input" placeholder="Type here..." oninput="updateAll()">
        </div>

        <div class="control-section">
            <label for="sepSelect">Select Decoration</label>
            <select id="sepSelect" onchange="updateAll()"></select>
        </div>

        <div id="generator-list">
            </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize the page
        populateDecorations(); 
        updateAll();
    </script>
</body>
</html>
